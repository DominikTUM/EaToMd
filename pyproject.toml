[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eatomd"
version = "0.1.0"
description = "Pipe-and-filter pipeline that exports a Sparx Enterprise Architect repository to Markdown"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.optional-dependencies]
windows = ["pywin32"]

[project.scripts]
eatomd = "eatomd.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
